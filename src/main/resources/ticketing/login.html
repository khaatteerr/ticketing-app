<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HelpDesk Pro — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:      #0d0f14;
    --bg2:     #13161e;
    --bg3:     #1a1e28;
    --border:  #252932;
    --text:    #e8eaf0;
    --text2:   #8b90a0;
    --text3:   #545968;
    --accent:  #4f7cff;
    --accent2: #6b5bfc;
    --green:   #22c55e;
    --red:     #ef4444;
  }
  [data-theme="light"] {
    --bg:      #f0f2f8;
    --bg2:     #ffffff;
    --bg3:     #e8eaf2;
    --border:  #d4d8e8;
    --text:    #1a1e2e;
    --text2:   #4a5070;
    --text3:   #8890aa;
    --accent:  #4f7cff;
    --accent2: #6b5bfc;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: background .25s, color .25s;
  }

  /* background grid */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(79,124,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,124,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* glow blobs */
  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(80px); pointer-events: none; opacity: 0.25;
  }
  .blob1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; }
  .blob2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; }

  .login-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 40px;
    width: 100%; max-width: 420px;
    position: relative; z-index: 10;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .logo {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 20px rgba(79,124,255,0.35);
  }
  .logo-text { font-size: 20px; font-weight: 700; }
  .logo-sub  { font-size: 12px; color: var(--text3); }

  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--text2); margin-bottom: 28px; }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text2); margin-bottom: 7px;
  }
  .input-wrap { position: relative; }
  .input-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    font-size: 16px; pointer-events: none;
  }
  .form-group input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 12px 11px 40px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,124,255,0.15);
  }
  .form-group input::placeholder { color: var(--text3); }

  .toggle-password {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    cursor: pointer; font-size: 15px; color: var(--text3);
    background: none; border: none; padding: 4px;
    transition: color 0.15s;
  }
  .toggle-password:hover { color: var(--text); }

  .error-msg {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 8px; padding: 11px 14px;
    font-size: 13px; color: var(--red);
    margin-bottom: 18px; display: none;
    align-items: center; gap: 8px;
  }
  .error-msg.show { display: flex; }

  .login-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; border: none; border-radius: 9px;
    padding: 13px; font-family: 'Space Grotesk', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 0 4px 20px rgba(79,124,255,0.3);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 4px;
  }
  .login-btn:hover   { opacity: 0.92; transform: translateY(-1px); }
  .login-btn:active  { transform: translateY(0); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.7s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer-links {
    margin-top: 24px; text-align: center;
    font-size: 12px; color: var(--text3);
  }
  .footer-links a { color: var(--accent); text-decoration: none; }
  .footer-links a:hover { text-decoration: underline; }

  .api-url-note {
    margin-top: 20px; padding: 10px 14px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; font-size: 11px; color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <button id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme" style="position:fixed;top:20px;right:20px;background:var(--bg2);border:1px solid var(--border);border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,0.15);transition:transform 0.15s, border-color 0.15s;">
    <span id="themeIcon">☀️</span>
  </button>

  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">🎫</div>
      <div>
        <div class="logo-text">HelpDesk Pro</div>
        <div class="logo-sub">Employee Portal</div>
      </div>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to submit and track your support tickets</p>

    <div class="error-msg" id="errorMsg">
      <span>⚠️</span><span id="errorText">Invalid credentials</span>
    </div>

    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username" autofocus/>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
        <button class="toggle-password" onclick="togglePwd()" tabindex="-1" id="eyeBtn">👁</button>
      </div>
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">
      <div class="spinner" id="spinner"></div>
      <span id="loginText">Sign In</span>
    </button>

    <div class="footer-links">
      <p>Contact your system administrator if you don't have an account.</p>
    </div>


  </div>

<script>
  // ── CONFIG ──────────────────────────────────────────
  const API_BASE = (window.location.origin && window.location.origin.startsWith('http'))
    ? window.location.origin
    : 'http://localhost:6080';

  const apiDisplay = document.getElementById('apiUrlDisplay');
  if (apiDisplay) apiDisplay.textContent = API_BASE;

  // Enter key support
  document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  // Toggle password visibility
  function togglePwd() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    document.getElementById('eyeBtn').textContent = inp.type === 'password' ? '👁' : '🙈';
  }

  function setLoading(on) {
    document.getElementById('loginBtn').disabled = on;
    document.getElementById('spinner').style.display  = on ? 'block' : 'none';
    document.getElementById('loginText').textContent  = on ? 'Signing in...' : 'Sign In';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    document.getElementById('errorText').textContent = msg;
    el.classList.add('show');
  }
  function hideError() {
    document.getElementById('errorMsg').classList.remove('show');
  }

  async function doLogin() {
    hideError();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) { showError('Please enter username and password'); return; }
     setLoading(true);
    try {
       const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const json = await res.json();

      if (!json.success) {
        showError(json.message || 'Login failed');
        return;
      }

      // Store token + user
      localStorage.setItem('hd_token', json.data.token);
      localStorage.setItem('hd_user',  JSON.stringify(json.data.user));

      // Redirect based on role
      const role = json.data.user.role;
      if (new URLSearchParams(window.location.search).get('next') === 'widget') {
        window.location.href = 'widget.html';
      } else if (role === 'Admin' || role === 'Support Agent') {
        window.location.href = 'index.html';
      } else {
        window.location.href = 'submit.html';
      }

    } catch (err) {
      //showError('Cannot connect to server. Check API_BASE in this file.');
      showError(err)
      console.error(err);
    } finally {
      setLoading(false);
    }
  }

  /* ── Theme Support (Light / Dark) ────────────────────────── */
  function initTheme() {
    const saved = localStorage.getItem('hd_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    updateThemeIcon(saved);
  }

  function updateThemeIcon(t) {
    const icon = document.getElementById('themeIcon');
    if (icon) icon.textContent = t === 'dark' ? '☀️' : '🌙';
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('hd_theme', next);
    updateThemeIcon(next);
  }

  initTheme();

  // Auto-redirect if already logged in
  (function checkExisting() {
    const token = localStorage.getItem('hd_token');
    const user  = JSON.parse(localStorage.getItem('hd_user') || 'null');
    if (token && user) {
      if (new URLSearchParams(window.location.search).get('next') === 'widget')
        window.location.href = 'widget.html';
      else if (user.role === 'Admin' || user.role === 'Support Agent')
        window.location.href = 'index.html';
      else
        window.location.href = 'submit.html';
    }
  })();
</script>
</body>
</html>
