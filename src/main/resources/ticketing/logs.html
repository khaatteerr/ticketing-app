<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HelpDesk Pro — Activity Logs</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar">
  <a href="index.html" class="sidebar-logo">
    <div class="logo-icon">🎫</div>
    <div>
      <div class="logo-text">HelpDesk Pro</div>
      <div class="logo-sub">Admin Portal</div>
    </div>
  </a>
  <div class="user-card">
    <div class="user-avatar" id="avatarInitial">A</div>
    <div>
      <div class="user-name" id="sidebarUser">Admin</div>
      <span class="user-role" id="sidebarRole">Admin</span>
    </div>
  </div>
  <nav>
    <div class="nav-section">Menu</div>
    <a href="index.html" class="nav-item" data-page="dashboard"><span class="ni">🏠</span> Dashboard</a>
    <a href="users.html" class="nav-item" data-page="users"><span class="ni">👥</span> Users</a>
    <a href="departments.html" class="nav-item" data-page="departments"><span class="ni">🏢</span> Departments</a>
    <a href="issues.html" class="nav-item" data-page="issues"><span class="ni">🎯</span> Issues</a>
    <a href="sync.html" class="nav-item" data-page="sync"><span class="ni">⚡</span> AD Sync</a>
    <div class="nav-section">Personal</div>
    <a href="logs.html" class="nav-item active" data-page="logs"><span class="ni">📋</span> Activity Logs</a>
    <a href="account.html" class="nav-item" data-page="account"><span class="ni">👤</span> My Account</a>
  </nav>
  <div class="sidebar-bottom">
    <div class="theme-toggle" onclick="toggleTheme()">
      <span id="themeIcon">☀️</span><span id="themeLabel">Light Mode</span>
    </div>
    <div class="logout-btn" onclick="doLogout()"><span>🚪</span> Logout</div>
  </div>
</aside>

<!-- MAIN -->
<div id="main">
  <div class="topbar">
    <div class="topbar-title">📋 Activity Logs <span>/ Audit Trail</span></div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="api-status">
        <div class="api-dot" id="apiDot"></div>
        <span id="apiStatus">Connecting...</span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="renderActivityLogs()">↻ Refresh</button>
    </div>
  </div>

  <div class="page-content">
    <div class="toolbar">
      <div class="toolbar-title">🔍 Filter Logs</div>
      <div class="filters-row" style="grid-template-columns: 2fr 1fr auto;">
        <div class="filter-group">
          <label>Search Logs</label>
          <input type="text" id="logSearch" placeholder="Search activity message..." oninput="renderActivityLogs()"/>
        </div>
        <div class="filter-group">
          <label>Event Type</label>
          <select id="logTypeFilter" onchange="renderActivityLogs()">
            <option value="">All Events</option>
            <option value="create">Ticket / User Created</option>
            <option value="edit">Updates & Edits</option>
            <option value="delete">Deletions</option>
            <option value="info">System Info</option>
          </select>
        </div>
        <div class="filter-group" style="display:flex;align-items:flex-end;">
          <button class="btn btn-danger btn-sm" style="height:36px;" onclick="handleClearLogs()">🗑 Clear Logs</button>
        </div>
      </div>
    </div>

    <div class="table-card" style="padding: 20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px;">
        <h3 style="font-size:15px;font-weight:600;">Recorded Actions</h3>
        <span style="font-size:12px;color:var(--text3);">Showing <span id="logCount">0</span> records</span>
      </div>
      <div class="log-list" id="logList"></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/app.js"></script>
<script src="js/logs.js"></script>
</body>
</html>
