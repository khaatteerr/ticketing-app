ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.helpdesk.ApplicationKt.module ]
    }
}

jwt {
    secret = "helpdesk-super-secret-jwt-key-change-in-production"
    issuer = "helpdesk"
    audience = "helpdesk-users"
    realm = "HelpDesk Pro"
    expirationHours = 24
}

mongodb {
    connectionString = "mongodb://localhost:27017"
    database = "helpdesk"
}
